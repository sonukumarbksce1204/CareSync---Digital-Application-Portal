<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Signup • CareSync</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

* {
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body {
    height:100vh;
    background: linear-gradient(120deg,#e6fff7,#d7f5ee,#f0fffb);
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Container */
.container {
    width:1100px;
    height:720px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(20px);
    border-radius:18px;
    display:flex;
    box-shadow:0 20px 60px rgba(0,0,0,0.08);
    overflow:hidden;
}

/* Left Panel */
.left {
    width:45%;
    background: linear-gradient(140deg,#1FBF8F,#3EC7A6);
    color:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1 {
    font-size:42px;
    font-weight:600;
    margin-bottom:10px;
}

.left p {
    font-size:16px;
    opacity:0.9;
}

.left .tag {
    margin-top:20px;
    font-size:14px;
    opacity:0.8;
}

/* Right Panel */
.right {
    width:55%;
    padding:50px 60px;
    overflow-y:auto;
}

.right h2 {
    font-size:28px;
    margin-bottom:20px;
    color:#1A2B2B;
}

.form-group {
    margin-bottom:14px;
}

input, select {
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #dceee8;
    outline:none;
    transition:0.3s;
}

input:focus, select:focus {
    border-color:#1FBF8F;
    box-shadow:0 0 8px rgba(31,191,143,0.2);
}

.btn {
    margin-top:10px;
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#1FBF8F;
    color:white;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover {
    background:#159D73;
}

.login-link {
    margin-top:14px;
    font-size:14px;
}

.login-link a {
    color:#1FBF8F;
    text-decoration:none;
    font-weight:500;
}

</style>

</head>

<body>

<div class="container">

<div class="left">
    <h1>CareSync</h1>
    <p>Doctor Professional Portal</p>
    <div class="tag">Digital Care • Trusted Healthcare Network</div>
</div>

<div class="right">

<h2>Doctor Signup</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<div class="form-group">
<input type="text" name="name" placeholder="Full Name" required>
</div>

<div class="form-group">
<input type="email" name="email" placeholder="Email" required>
</div>

<div class="form-group">
<input type="text" name="phone" placeholder="Phone Number" required>
</div>

<div class="form-group">
<label>Select Specializations</label>
<select name="specializations" multiple required size="5">
    {% for s in specializations %}
        <option value="{{ s.id }}">{{ s.name }}</option>
    {% endfor %}
</select>
<small>Hold CTRL (Windows) or CMD (Mac) to select multiple</small>
</div>

<div class="form-group">
<input type="text" name="qualification" placeholder="Qualification">
</div>

<div class="form-group">
<input type="number" name="experience" placeholder="Years of Experience">
</div>

<div class="form-group">
<input type="text" name="license_number" placeholder="Medical License Number" required>
</div>

<div class="form-group">
<input type="file" name="license_file" required>
</div>

<div class="form-group">
<input type="password" name="password" placeholder="Password" required>
</div>

<div class="form-group">
<input type="password" name="confirm_password" placeholder="Confirm Password" required>
</div>

<button class="btn">Create Doctor Account</button>

</form>

<div class="login-link">
Already registered? <a href="{% url 'doctor_login' %}">Login</a>
</div>
</div>

</div>

</div>

</body>
</html>
