<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Search • CareSync</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(120deg,#e6fff7,#d7f5ee,#f0fffb);height:100vh;display:flex;}
.sidebar{width:250px;background:linear-gradient(140deg,#1FBF8F,#3EC7A6);color:white;padding:30px;display:flex;flex-direction:column;}
.logo{font-size:28px;font-weight:600;margin-bottom:40px;cursor:pointer;}
.nav a{color:white;text-decoration:none;display:block;margin:15px 0;font-size:15px;opacity:0.9;}
.logout{margin-top:auto;}
.logout a{color:white;text-decoration:none;font-weight:500;}
.main{flex:1;padding:40px;overflow-y:auto;}
.top{font-size:24px;font-weight:600;margin-bottom:30px;}
.card{background:rgba(255,255,255,0.75);border-radius:16px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,0.05);max-width: 600px;}
input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; }
button { padding: 12px 20px; background: #1FBF8F; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%;}
.error { color: red; margin-bottom: 15px;}
</style>
</head>
<body>
<div class="sidebar">
<div class="logo">CareSync</div>
<div class="nav">
<a href="{% url 'doctor_dashboard' %}">Dashboard</a>
<a href="{% url 'doctor_search' %}">Search Records</a>
<a href="{% url 'doctor_profile' %}">View Profile</a>
</div>
<div class="logout"><a href="{% url 'doctor_logout' %}">Logout</a></div>
</div>

<div class="main">
<div class="top">Patient Record Lookup</div>
<div class="card">
<h3>Enter ID to Search</h3><br>
{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="GET" action="{% url 'doctor_search' %}">
<label>Search Type</label>
<select name="type" required>
    <option value="personal">Personal Health ID</option>
    <option value="family">Family Health ID</option>
</select>
<label>Health ID</label>
<input type="text" name="q" placeholder="Enter ID here..." required>
<button type="submit">Search Records</button>
</form>

</div>
</div>
</body>
</html>
