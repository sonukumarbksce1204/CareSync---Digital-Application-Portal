{% load static %}
<link rel="stylesheet" href="{% static 'patient/dashboard.css' %}">
<div class="navbar"><div class="logo">CareSync</div></div>
<div class="dashboard" style="max-width: 600px; margin: 40px auto;">
    <div class="section">
        <h3>Transfer Head of Family</h3>
        <p>Select a new member to assume full family view permissions.</p>

        {% if error %}<p class="error-message">{{ error }}</p>{% endif %}

        <form method="POST" action="{% url 'change_family_head' %}">
            {% csrf_token %}
            <div><label>New Head Member</label><br>{{ form.new_head }}</div>
            <div style="margin-top:15px;"><label>Reason for Transfer</label><br>{{ form.reason }}</div>
            <br>
            <button type="submit" class="btn primary">Confirm Transfer</button>
            <a href="{% url 'patient_family_hub' %}" class="btn secondary">Cancel</a>
        </form>
    </div>
</div>
