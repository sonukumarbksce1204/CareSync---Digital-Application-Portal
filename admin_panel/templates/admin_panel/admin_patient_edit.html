<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Patient • CareSync Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(120deg,#0f172a,#1e293b);min-height:100vh;display:flex;}
.sidebar{width:240px;background:rgba(255,255,255,0.04);border-right:1px solid rgba(255,255,255,0.08);padding:30px 20px;display:flex;flex-direction:column;min-height:100vh;flex-shrink:0;}
.logo{font-size:22px;font-weight:700;color:#1FBF8F;margin-bottom:8px;}
.logo span{color:#94a3b8;font-size:13px;font-weight:400;display:block;}
.nav{margin-top:30px;flex:1;}
.nav a{display:flex;align-items:center;gap:10px;color:#94a3b8;text-decoration:none;padding:11px 14px;border-radius:10px;margin-bottom:4px;font-size:14px;transition:all 0.2s;}
.nav a:hover,.nav a.active{background:rgba(31,191,143,0.12);color:#1FBF8F;}
.logout-btn{display:block;color:#f87171;text-decoration:none;padding:11px 14px;border-radius:10px;font-size:14px;}
.logout-btn:hover{background:rgba(248,113,113,0.1);}
.main{flex:1;padding:40px;overflow-y:auto;}
.page-title{color:white;font-size:24px;font-weight:700;margin-bottom:4px;}
.subtitle{color:#64748b;font-size:14px;margin-bottom:28px;}

.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:30px;max-width:800px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-group.full{grid-column:1/-1;}
.form-group label{font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;}
.form-group input,.form-group select,.form-group textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:white;padding:10px 14px;border-radius:8px;font-size:14px;font-family:'Poppins',sans-serif;outline:none;transition:.2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#1FBF8F;box-shadow:0 0 0 3px rgba(31,191,143,0.12);}
.form-group select option{background:#1e293b;color:white;}

.btn-save{background:linear-gradient(135deg,#1FBF8F,#3EC7A6);color:white;border:none;padding:12px 28px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s;margin-top:8px;}
.btn-save:hover{opacity:.9;transform:translateY(-1px);}
.btn-back{display:inline-flex;align-items:center;gap:6px;color:#94a3b8;text-decoration:none;font-size:13px;margin-bottom:20px;padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);transition:.2s;}
.btn-back:hover{color:white;border-color:rgba(255,255,255,0.2);}
.section-label{color:#94a3b8;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:30px 0 15px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:8px;}
</style>
</head>
<body>
{% include 'admin_panel/_sidebar.html' with active='patients' %}
<div class="main">
    <a href="{% url 'admin_patients' %}" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Back to Patients</a>
    <div class="page-title">Edit Patient</div>
    <p class="subtitle">Update details for CareSync ID: <span style="font-family:monospace;color:#60a5fa;font-weight:700;">{{ patient.patient_id }}</span></p>

    <div class="card">
        <form method="POST">
            {% csrf_token %}
            
            <div class="section-label" style="margin-top:0;">Account Information</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" name="first_name" value="{{ patient.user.first_name }}">
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" name="last_name" value="{{ patient.user.last_name }}">
                </div>
                <div class="form-group full">
                    <label>Email Address</label>
                    <input type="email" name="email" value="{{ patient.user.email }}" required>
                </div>
            </div>

            <div class="section-label">Demographics & Profile</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" value="{{ patient.age|default:'' }}" min="0">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="" {% if not patient.gender %}selected{% endif %}>Not Specified</option>
                        <option value="male" {% if patient.gender == 'male' %}selected{% endif %}>Male</option>
                        <option value="female" {% if patient.gender == 'female' %}selected{% endif %}>Female</option>
                        <option value="other" {% if patient.gender == 'other' %}selected{% endif %}>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Blood Group</label>
                    <select name="blood_group">
                        <option value="">Unknown</option>
                        <option value="A+" {% if patient.blood_group == 'A+' %}selected{% endif %}>A+</option>
                        <option value="A-" {% if patient.blood_group == 'A-' %}selected{% endif %}>A-</option>
                        <option value="B+" {% if patient.blood_group == 'B+' %}selected{% endif %}>B+</option>
                        <option value="B-" {% if patient.blood_group == 'B-' %}selected{% endif %}>B-</option>
                        <option value="O+" {% if patient.blood_group == 'O+' %}selected{% endif %}>O+</option>
                        <option value="O-" {% if patient.blood_group == 'O-' %}selected{% endif %}>O-</option>
                        <option value="AB+" {% if patient.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                        <option value="AB-" {% if patient.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
                    </select>
                </div>
            </div>

            <div class="section-label">Contact & Emergency</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" value="{{ patient.phone }}">
                </div>
                <div class="form-group">
                    <label>Emergency Contact</label>
                    <input type="text" name="emergency_contact" value="{{ patient.emergency_contact }}">
                </div>
                <div class="form-group full">
                    <label>Residential Address</label>
                    <textarea name="address" rows="3">{{ patient.address }}</textarea>
                </div>
            </div>

            <div style="margin-top:30px;display:flex;gap:12px;align-items:center;">
                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
                <a href="{% url 'admin_patients' %}" class="btn-back" style="margin-bottom:0;">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
